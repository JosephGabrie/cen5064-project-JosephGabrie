services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sis-backend
    restart: unless-stopped
    ports:
      - "6769:6769"
    env_file:
      - path: .env
        required: false
    environment:
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:6769/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_AUTO_LOGIN_USER=${NEXT_PUBLIC_AUTO_LOGIN_USER:-}
      - NEXT_PUBLIC_AUTO_LOGIN_PASSWORD=${NEXT_PUBLIC_AUTO_LOGIN_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
